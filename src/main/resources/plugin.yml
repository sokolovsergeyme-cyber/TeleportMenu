name: RaiderWorld
version: '${project.version}'
main: com.raiderworld.RaiderWorldPlugin
api-version: '26.1'
authors: [RaiderWorldDev]
description: Configurable raid plugin with waves, BossBar, advanced mob AI and full command configuration. Compatible with Geyser (Java + Bedrock).
website: https://github.com/yourname/RaiderWorld

commands:
  raid:
    description: Main command for RaiderWorld plugin
    usage: /raid <subcommand>
    permission: raiderworld.admin
    aliases: [rw, raider]

permissions:
  raiderworld.admin:
    description: Full access to all RaiderWorld commands and settings
    default: op
  raiderworld.start:
    description: Allow starting raids
    default: op
  raiderworld.bypass:
    description: Bypass raid restrictions
    default: false
